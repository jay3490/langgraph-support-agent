[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "langgraph-support-agent"
version = "0.1.0"
description = "A multi-agent customer-support workflow built with LangGraph and served with FastAPI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jay3490" }]
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain-core>=1.7,<2",
    "langchain-openai>=1.7,<2",
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.16",
]

[project.scripts]
support-agent = "support_agent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "httpx>=0.28",
    "ruff>=0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
